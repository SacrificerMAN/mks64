<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Solve chess puzzles by theme — pin, fork, skewer, mate in 1/2/3.">
<title>Daily Chess Puzzle | Saran Chess Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools.css">
</head>
<body data-require-auth="1">
<nav>
  <a class="logo" href="/">♟ Saran Chess Academy</a>
  <div class="nav-links">
    <a href="/explore.html" class="on">Chess Hub</a>
    <a href="/tournaments.html">Tournaments</a>
    <a href="/#join">Join</a>
  </div>
  <a class="btn btn-solid" href="/#join">Book a free Demo</a>
</nav>
<main>
<div class="wrap">
  <div class="page-head"><h1>🧩 Daily Puzzle</h1><p>Pick a theme — a matching puzzle loads on the board.</p></div>
  <div class="layout">
    <div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <p class="status" id="status">Loading…</p>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" id="reset" type="button">↻ New puzzle</button>
        <button class="btn btn-outline" id="reveal" type="button">💡 Reveal</button>
        <a class="btn btn-outline" href="/explore.html">← Chess Hub</a>
      </div>
    </div>
    <div class="side">
      <div class="card" style="text-align:center"><h3>Puzzle Rating</h3><div class="badge" id="rating">—</div></div>
      <div class="card"><h3>Your turn</h3><div id="turnLabel" style="font-weight:600">—</div><div class="status" id="stepLabel" style="margin:0">—</div></div>
      <div class="card">
        <h3>Themes</h3>
        <div class="chips" id="themeChips" style="margin:0"></div>
      </div>
      <div class="card"><h3>From the game</h3><div id="fromGame"></div></div>
    </div>
  </div>
</div>
</main>
<footer>
  <div>© 2026 Saran Chess Academy</div>
  <div><a href="/">Home</a> · <a href="/explore.html">Chess Hub</a> · <a href="/tournaments.html">Tournaments</a></div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="/board.js"></script>
<script>
const THEMES=[
  {id:'pin',label:'Pin'},
  {id:'fork',label:'Fork'},
  {id:'skewer',label:'Skewer'},
  {id:'discoveredAttack',label:'Discovered Attack'},
  {id:'mateIn1',label:'Mate in 1'},
  {id:'mateIn2',label:'Mate in 2'},
  {id:'mateIn3',label:'Mate in 3'}
];
const boardEl=document.getElementById('board');
const statusEl=document.getElementById('status');
const chipsEl=document.getElementById('themeChips');
let chess=null,solution=[],solIndex=0,selected=null,playerColor='w',currentAngle='mateIn1';
let lastFetch=0;

THEMES.forEach(t=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='chip'+(t.id===currentAngle?' on':'');
  b.textContent=t.label;
  b.dataset.angle=t.id;
  b.onclick=()=>{
    currentAngle=t.id;
    chipsEl.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.angle===currentAngle));
    load();
  };
  chipsEl.appendChild(b);
});

function fenFromPgn(pgn){
  const c=new Chess();
  if(!pgn) return null;
  try{
    if(c.load_pgn(String(pgn), {sloppy:true})) return c.fen();
  }catch(e){}
  const c2=new Chess();
  const parts=String(pgn).replace(/\d+\./g,' ').trim().split(/\s+/).filter(Boolean);
  for(const san of parts){
    if(['1-0','0-1','1/2-1/2','*'].includes(san)) break;
    const m=c2.move(san, {sloppy:true});
    if(!m) break;
  }
  return c2.fen();
}

function applyPuzzle(d){
  const puzzle=d.puzzle, game=d.game||{};
  let fen=puzzle.fen;
  if(!fen && game.pgn) fen=fenFromPgn(game.pgn);
  if(!fen) throw new Error('no fen');
  document.getElementById('rating').textContent=puzzle.rating||'—';
  document.getElementById('fromGame').innerHTML=(game.players||[]).map(p=>'<div class="stat-row"><span>'+p.color+'</span><b>'+(p.name||'')+' ('+(p.rating||'?')+')</b></div>').join('')||'—';
  chess=new Chess(fen);
  playerColor=chess.turn();
  solution=puzzle.solution||[];
  solIndex=0;selected=null;
  document.getElementById('turnLabel').textContent=(playerColor==='w'?'White':'Black')+' to move';
  document.getElementById('stepLabel').textContent='Step 1 of '+Math.max(1,Math.ceil(solution.length/2));
  draw();
  statusEl.textContent='Find the best move!';if(window._scaSoftGate)_scaSoftGate();
}

async function load(){
  statusEl.textContent='Loading puzzle…';
  selected=null;solution=[];solIndex=0;chess=null;
  boardEl.innerHTML='';
  const wait=1200-(Date.now()-lastFetch);
  if(wait>0) await new Promise(r=>setTimeout(r,wait));
  try{
    lastFetch=Date.now();
    const res=await fetch('https://lichess.org/api/puzzle/next?angle='+encodeURIComponent(currentAngle),{headers:{Accept:'application/json'}});
    if(res.status===429){
      statusEl.textContent='Theme busy — loading daily puzzle…';
      lastFetch=Date.now();
      const daily=await (await fetch('https://lichess.org/api/puzzle/daily',{headers:{Accept:'application/json'}})).json();
      applyPuzzle(daily);
      statusEl.textContent='Daily puzzle (theme limit reached). Find the best move!';if(window._scaSoftGate)_scaSoftGate();
      return;
    }
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(!d.puzzle) throw new Error('no puzzle');
    applyPuzzle(d);
  }catch(e){
    console.error(e);
    try{
      const daily=await (await fetch('https://lichess.org/api/puzzle/daily',{headers:{Accept:'application/json'}})).json();
      applyPuzzle(daily);
      statusEl.textContent='Daily puzzle loaded. Find the best move!';if(window._scaSoftGate)_scaSoftGate();
    }catch(e2){
      statusEl.textContent='Could not load puzzle. Wait a few seconds and try again.';
    }
  }
}
function draw(hints=[]){
  if(!chess) return;
  renderBoard(boardEl,chess.fen(),{flip:playerColor==='b',selected,hints,onClick:onSq});
}
function onSq(sq,piece){
  if(!chess||solIndex>=solution.length) return;
  if(selected){
    const from=selected;selected=null;
    const expected=solution[solIndex];
    if((from+sq)===expected.slice(0,4)||(from+sq+'q')===expected){
      const uci=expected;
      const m=chess.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'});
      if(!m){statusEl.textContent='Move error';draw();return}
      solIndex++;draw();statusEl.textContent='Correct!';
      if(solIndex<solution.length){
        setTimeout(()=>{
          const u=solution[solIndex];
          chess.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});
          solIndex++;draw();
          if(solIndex>=solution.length){statusEl.textContent='Puzzle solved!';document.getElementById('stepLabel').textContent='Complete'}
          else{statusEl.textContent='Your turn.';document.getElementById('stepLabel').textContent='Step '+(Math.floor(solIndex/2)+1)+' of '+Math.ceil(solution.length/2)}
        },400);
      } else {statusEl.textContent='Puzzle solved!';document.getElementById('stepLabel').textContent='Complete'}
    } else {statusEl.textContent='Not the best move — try again.';draw()}
  } else if(piece && ((playerColor==='w'&&piece===piece.toUpperCase())||(playerColor==='b'&&piece===piece.toLowerCase()))){
    selected=sq;draw(chess.moves({square:sq,verbose:true}).map(m=>m.to));
  }
}
document.getElementById('reveal').onclick=()=>{statusEl.textContent=solution.length?('Solution: '+solution.join(' → ')):'No solution'};
document.getElementById('reset').onclick=load;
load();
</script>
<script src="/lead-cta.js"></script>
<script>document.addEventListener("DOMContentLoaded",function(){if(window.SCALead){SCALead.injectStrip("puzzle");window._scaSoftGate=function(){SCALead.softGate("puzzle",2);};}});</script>
<script src="/auth.js"></script>
</body>
</html>
