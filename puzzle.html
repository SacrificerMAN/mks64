<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Solve today’s free daily chess puzzle from Lichess.">
<title>Daily Chess Puzzle — Solve Today’s Puzzle Free | Saran Chess Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--bg2:#0a0a0a;--surface:#111;--border:rgba(255,255,255,.08);--text:#f5f5f5;--muted:#8a8a8a;--green:#10a37f;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:fixed;inset:0 0 auto;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,5,5,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{font-weight:600}
.nav-links{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.nav-links a.on{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;border:1px solid transparent}
.btn-solid{background:#fff;color:#050505}.btn-outline{border-color:var(--border)}
main{padding:100px 0 64px}
.sec-label{font-size:12px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em}
.lead{margin-top:10px;color:var(--muted);max-width:520px}
.panel{margin-top:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow:hidden;max-width:480px}
.panel iframe{width:100%;border:0;border-radius:10px;background:#000;display:block;aspect-ratio:1/1.12;min-height:420px}
footer{padding:32px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:800px){.nav-links{display:none}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">♟ Saran Chess Academy</a>
  <div class="nav-links">
    <a href="/explore.html" class="on">Chess Hub</a>
    <a href="/tournaments.html">Tournaments</a>
    <a href="/#join">Join</a>
  </div>
  <a class="btn btn-solid" href="/#join">Book a free call</a>
</nav>
<main><div class="wrap">
  <div class="sec-label">Chess Hub</div>
  <h1>Daily Puzzle</h1>
  <p class="lead">One carefully chosen tactic every day. Click the board to solve.</p>
  <div class="panel"><iframe src="https://lichess.org/training/frame?theme=green&bg=dark" allowtransparency="true" title="Daily chess puzzle"></iframe></div>
  <p style="margin-top:16px"><a class="btn btn-outline" href="/explore.html">← Back to Chess Hub</a></p>
</div></main>
<footer><div>© 2026 Saran Chess Academy</div><div><a href="/">Home</a> · <a href="/explore.html">Chess Hub</a></div></footer>
</body></html>
