<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Join free live chess tournaments on Lichess — Arena and Swiss events.">
<title>Live Chess Tournaments Online | Saran Chess Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--surface:#111;--border:rgba(255,255,255,.08);--text:#f5f5f5;--muted:#8a8a8a;--green:#10a37f;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:fixed;inset:0 0 auto;z-index:100;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,5,5,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{font-weight:600}
.nav-links{display:flex;gap:18px;font-size:14px;color:var(--muted)}
.nav-links a.on{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 18px;font-size:14px;font-weight:500;border:1px solid transparent}
.btn-solid{background:#fff;color:#050505}
main{padding:100px 0 64px}
.sec-label{font-size:12px;font-weight:600;color:var(--green);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.03em}
.lead{margin-top:10px;color:var(--muted);max-width:520px}
.tour-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;align-items:center}
.tour-filters button{border:1px solid var(--border);background:transparent;color:var(--muted);padding:8px 14px;border-radius:999px;font-size:13px;cursor:pointer}
.tour-filters button.active{border-color:var(--green);color:#fff;background:rgba(16,163,127,.12)}
.tour-meta{font-size:13px;color:var(--muted);margin-left:auto}
.tour-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.tour-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px}
.tour-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-card .live{font-size:11px;font-weight:600;color:var(--green);display:inline-flex;align-items:center;gap:6px}
.tour-card .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.tour-card .speed{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.tour-card h3{font-size:16px;line-height:1.3}
.tour-card .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.tour-card .stat span:last-child{color:var(--text)}
.tour-card .join{margin-top:6px;display:inline-flex;align-items:center;justify-content:center;width:100%;padding:11px;border-radius:12px;background:var(--green);color:#fff;font-size:14px;font-weight:500}
footer{padding:32px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:900px){.tour-grid{grid-template-columns:1fr}.nav-links{display:none}}
</style>
</head>
<body>
<nav>
  <a class="logo" href="/">♟ Saran Chess Academy</a>
  <div class="nav-links">
    <a href="/explore.html">Chess Hub</a>
    <a href="/tournaments.html" class="on">Tournaments</a>
    <a href="/#join">Join</a>
  </div>
  <a class="btn btn-solid" href="/#join">Book a free call</a>
</nav>
<main><div class="wrap">
  <div class="sec-label">Play online</div>
  <h1>Upcoming Chess Tournaments</h1>
  <p class="lead">Online tournaments from Lichess — join in one click.</p>
  <div class="tour-filters">
    <button type="button" class="active" data-filter="all">All</button>
    <button type="button" data-filter="bullet">Bullet</button>
    <button type="button" data-filter="blitz">Blitz</button>
    <button type="button" data-filter="rapid">Rapid</button>
    <button type="button" data-filter="classical">Classical</button>
    <span class="tour-meta" id="tourMeta">Loading…</span>
    <button type="button" id="tourRefresh">↻ Refresh</button>
  </div>
  <div class="tour-grid" id="tourGrid"></div>
</div></main>
<footer><div>© 2026 Saran Chess Academy</div><div><a href="/">Home</a> · <a href="/explore.html">Chess Hub</a> · <a href="/tournaments.html">Tournaments</a></div></footer>
<script>
(function(){
  const grid=document.getElementById('tourGrid');
  const meta=document.getElementById('tourMeta');
  if(!grid) return;
  let all=[], filter='all';
  function fmtClock(c){if(!c)return'—';return Math.floor((c.limit||0)/60)+'+'+(c.increment||0)}
  function ago(ms){const d=Date.now()-ms;if(d<6e4)return'just now';if(d<36e5)return Math.floor(d/6e4)+'m ago';return Math.floor(d/36e5)+'h ago'}
  function speedKey(t){const k=(t.perf&&t.perf.key)||'';if(['bullet','ultraBullet'].includes(k))return'bullet';if(['blitz','superBlitz'].includes(k))return'blitz';if(k==='rapid')return'rapid';if(k==='classical')return'classical';return k||'other'}
  function render(){
    const list=all.filter(t=>filter==='all'||speedKey(t)===filter).slice(0,12);
    meta.textContent=all.length+' live · showing '+list.length;
    grid.innerHTML=list.map(t=>{
      const variant=(t.variant&&t.variant.name&&t.variant.key!=='standard')?t.variant.name:'';
      return '<div class="tour-card"><div class="row"><span class="live">LIVE NOW</span><span class="speed">'+(t.perf&&t.perf.name||'Arena')+'</span></div><h3>'+t.fullName+'</h3><div class="stat"><span>Time Control</span><span>'+fmtClock(t.clock)+(t.minutes?(' · '+t.minutes+'min'):'')+'</span></div><div class="stat"><span>Players</span><span>'+(t.nbPlayers||0)+'</span></div><div class="stat"><span>Started</span><span>'+ago(t.startsAt)+'</span></div>'+(variant?'<div class="stat"><span>Variant</span><span>'+variant+'</span></div>':'')+'<a class="join" href="https://lichess.org/tournament/'+t.id+'" target="_blank" rel="noopener">▶ Join Now on Lichess</a></div>';
    }).join('')||'<p style="color:var(--muted)">No live tournaments in this filter.</p>';
  }
  function load(){meta.textContent='Loading…';fetch('https://lichess.org/api/tournament',{headers:{Accept:'application/json'}}).then(r=>r.json()).then(d=>{all=(d.started||[]).slice().sort((a,b)=>(b.nbPlayers||0)-(a.nbPlayers||0));render()}).catch(()=>meta.textContent='Could not load')}
  document.querySelectorAll('.tour-filters button[data-filter]').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.tour-filters button[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filter=btn.dataset.filter;render()}});
  document.getElementById('tourRefresh').onclick=load;load();
})();
</script>
</body></html>
