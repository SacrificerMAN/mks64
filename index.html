<html lang="en"><head>

<title>Saran Chess Academy</title>

<style>body{background:#050505;color:#aaa;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}</style>
<script src="favicon.js"></script>
</head><body><p id="s">Loading Saran Chess Academy…</p>
<script src="c0.js"></script>
<script src="c1.js"></script>
<script>
(async function(){
  try {
    var b64 = (window.__C0||"")+(window.__C1||"");
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var ds = new DecompressionStream("deflate-raw");
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    var html = await new Response(stream).text();
    if (html.indexOf("Book a free Demo") === -1) throw new Error("bad content");
    var fav = '<script src="favicon.js"><\/script>';
    html = html.replace(/<\/title>/i, '</title>' + fav);
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.getElementById("s").innerHTML = "Loading failed. Please refresh.";
  }
})();
</script>
</body></html>
