<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Explore chess openings with book moves and win rates.">
<title>Opening Explorer | Saran Chess Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tools.css">
</head>
<body data-require-auth="1">
<nav>
  <a class="logo" href="/">♟ Saran Chess Academy</a>
  <div class="nav-links">
    <a href="/explore.html" class="on">Chess Hub</a>
    <a href="/tournaments.html">Tournaments</a>
    <a href="/#join">Join</a>
  </div>
  <a class="btn btn-solid" href="/#join">Book a free Demo</a>
</nav>
<main>
<div class="wrap">
  <div class="page-head"><h1>📖 Opening Explorer</h1><p>Click pieces to explore. Book moves with win rates from ChessDB.</p></div>
  <div class="chips">
    <button type="button" class="chip on" data-preset="start">Start</button>
    <button type="button" class="chip" data-preset="italian">Italian</button>
    <button type="button" class="chip" data-preset="ruy">Ruy López</button>
    <button type="button" class="chip" data-preset="sicilian">Sicilian</button>
    <button type="button" class="chip" data-preset="qg">QG</button>
    <button type="button" class="chip" data-preset="french">French</button>
    <button type="button" class="chip" data-preset="caro">Caro-Kann</button>
    <button type="button" class="chip" data-preset="london">London</button>
    <button type="button" class="chip" data-preset="kid">KID</button>
  </div>
  <div class="layout">
    <div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <p class="status" id="fenLabel" style="font-size:12px"></p>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" id="undoBtn" type="button">← Undo</button>
        <button class="btn btn-outline" id="resetBtn" type="button">Reset</button>
        <a class="btn btn-outline" href="/explore.html">← Chess Hub</a>
      </div>
    </div>
    <div class="side"><div class="card"><h3>Top moves</h3><p class="status" id="status" style="margin:0 0 10px">—</p><div class="move-list" id="moves"></div></div></div>
  </div>
</div>
</main>
<footer>
  <div>© 2026 Saran Chess Academy</div>
  <div><a href="/">Home</a> · <a href="/explore.html">Chess Hub</a> · <a href="/tournaments.html">Tournaments</a></div>
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="/board.js"></script>
<script>
const boardEl=document.getElementById('board');
const movesEl=document.getElementById('moves');
const statusEl=document.getElementById('status');
let chess=new Chess(), selected=null;
const PRESETS={
  start:'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
  italian:()=>{const c=new Chess();['e4','e5','Nf3','Nc6','Bc4'].forEach(m=>c.move(m));return c.fen()},
  ruy:()=>{const c=new Chess();['e4','e5','Nf3','Nc6','Bb5'].forEach(m=>c.move(m));return c.fen()},
  sicilian:()=>{const c=new Chess();c.move('e4');c.move('c5');return c.fen()},
  qg:()=>{const c=new Chess();['d4','d5','c4'].forEach(m=>c.move(m));return c.fen()},
  french:()=>{const c=new Chess();c.move('e4');c.move('e6');return c.fen()},
  caro:()=>{const c=new Chess();c.move('e4');c.move('c6');return c.fen()},
  london:()=>{const c=new Chess();['d4','d5','Nf3','Nf6','Bf4'].forEach(m=>c.move(m));return c.fen()},
  kid:()=>{const c=new Chess();['d4','Nf6','c4','g6'].forEach(m=>c.move(m));return c.fen()}
};
function draw(hints=[]){renderBoard(boardEl,chess.fen(),{selected,hints,onClick:onSq});document.getElementById('fenLabel').textContent=chess.fen().split(' ').slice(0,2).join(' ')}
function onSq(sq,piece){
  if(selected){const from=selected;selected=null;if(chess.move({from,to:sq,promotion:'q'})){draw();loadMoves()}else draw()}
  else if(piece){selected=sq;draw(chess.moves({square:sq,verbose:true}).map(m=>m.to))}
}
async function loadMoves(){
  statusEl.textContent='Loading book moves…';movesEl.innerHTML='';
  try{
    const r=await fetch('https://www.chessdb.cn/cdb.php?action=queryall&board='+encodeURIComponent(chess.fen()));
    const text=await r.text();
    const moves=[];
    text.split('|').forEach(part=>{const o={};part.split(',').forEach(kv=>{const i=kv.indexOf(':');if(i>0)o[kv.slice(0,i)]=kv.slice(i+1)});if(o.move)moves.push(o)});
    if(!moves.length){statusEl.textContent='No book data — move pieces freely.';return}
    statusEl.textContent=moves.length+' book moves';
    moves.slice(0,12).forEach(m=>{
      const uci=m.move;const wr=parseFloat(m.winrate||0);
      const div=document.createElement('div');div.className='move-item';
      const tmp=new Chess(chess.fen());const mv=tmp.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'});
      div.innerHTML='<span class="san">'+(mv?mv.san:uci)+'</span><span class="bar"><i style="width:'+(wr||15)+'%"></i></span><span class="pct">'+(wr?wr.toFixed(1)+'%':(m.note||''))+'</span>';
      div.onclick=()=>{if(chess.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||'q'})){selected=null;draw();loadMoves()}};
      movesEl.appendChild(div);
    });
  }catch(e){statusEl.textContent='Book unavailable — move pieces freely.'}
}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const k=b.dataset.preset;const fen=typeof PRESETS[k]==='function'?PRESETS[k]():PRESETS[k];chess=new Chess(fen);selected=null;draw();loadMoves();document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('on',x===b))});
document.getElementById('undoBtn').onclick=()=>{chess.undo();selected=null;draw();loadMoves()};
document.getElementById('resetBtn').onclick=()=>{chess=new Chess();selected=null;draw();loadMoves()};
draw();loadMoves();
</script>
<script src="/auth.js"></script>
</body>
</html>
